<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgUV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="uvPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="silverBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="450" fill="url(#bgUV)" rx="16"/>
  <ellipse cx="200" cy="405" rx="120" ry="15" fill="#CBD5E1" opacity="0.6"/>
  <g transform="translate(100, 45)">
    <!-- Sleek Slim UV+UF Body -->
    <rect x="0" y="0" width="200" height="340" rx="20" fill="url(#silverBody)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Top Deep Purple / Indigo Header -->
    <path d="M0 35 C0 15, 15 0, 35 0 L165 0 C185 0, 200 15, 200 35 L200 65 L0 65 Z" fill="url(#uvPurple)"/>
    <text x="100" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DHANALAKSHMI <tspan fill="#A5B4FC">PUREIT</tspan></text>
    <text x="100" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#E0E7FF" text-anchor="middle">ULTRA SLEEK UV + UF</text>
    <!-- UV Lamp Glow chamber window -->
    <rect x="35" y="85" width="130" height="70" rx="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="50" y="110" width="100" height="15" rx="7" fill="#818CF8" opacity="0.9"/>
    <text x="100" y="121" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">11W UV STERILIZER</text>
    <text x="100" y="145" font-family="sans-serif" font-size="7.5" fill="#A5B4FC" text-anchor="middle">Zero Water Wastage</text>
    <!-- Pure Water Storage -->
    <rect x="25" y="175" width="150" height="110" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <path d="M26 210 Q60 205, 100 210 T174 208 L174 278 C174 282, 170 284, 165 284 L35 284 C30 284, 26 282, 26 278 Z" fill="#6366F1" opacity="0.6"/>
    <!-- Tap -->
    <g transform="translate(85, 295)">
      <rect x="8" y="0" width="14" height="15" rx="3" fill="#64748B"/>
      <path d="M12 15 L18 15 L17 30 L13 30 Z" fill="#4338CA"/>
      <circle cx="15" cy="8" r="3" fill="#818CF8"/>
    </g>
    <!-- Bottom Rim -->
    <rect x="0" y="332" width="200" height="8" rx="4" fill="url(#uvPurple)"/>
  </g>
</svg>
