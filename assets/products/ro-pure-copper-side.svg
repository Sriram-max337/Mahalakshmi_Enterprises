<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="copperS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E66"/>
      <stop offset="100%" stop-color="#A53F0B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="450" fill="url(#bgS)" rx="16"/>
  <ellipse cx="200" cy="405" rx="130" ry="16" fill="#CBD5E1" opacity="0.6"/>
  <g transform="translate(110, 50)">
    <!-- 3/4 Side Angle Profile of RO Purifier -->
    <path d="M20 10 L140 0 L170 30 L170 330 L50 350 L20 330 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
    <path d="M20 10 L50 30 L170 30 L140 0 Z" fill="#CBD5E1"/>
    <!-- Front Face -->
    <path d="M20 10 L50 30 L50 350 L20 330 Z" fill="#0F172A"/>
    <!-- Side Body -->
    <rect x="50" y="30" width="120" height="320" fill="#FFFFFF" stroke="#CBD5E1"/>
    <!-- Copper accent band -->
    <rect x="50" y="320" width="120" height="15" fill="url(#copperS)"/>
    <!-- Side Filter View Cutout -->
    <rect x="65" y="70" width="90" height="180" rx="10" fill="#E2E8F0" stroke="#94A3B8"/>
    <!-- Internal filter cartridges visible -->
    <rect x="75" y="85" width="22" height="150" rx="6" fill="#38BDF8"/>
    <rect x="102" y="85" width="22" height="150" rx="6" fill="#10B981"/>
    <rect x="128" y="85" width="22" height="150" rx="6" fill="url(#copperS)"/>
    <text x="110" y="275" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">INTERNAL FILTER BAY</text>
    <text x="110" y="295" font-family="sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Quick-Change Connectors</text>
  </g>
</svg>
