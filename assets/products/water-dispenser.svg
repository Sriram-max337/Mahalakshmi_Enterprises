<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dispBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="450" fill="#F8FAFC" rx="16"/>
  <ellipse cx="200" cy="415" rx="110" ry="14" fill="#CBD5E1" opacity="0.6"/>
  <g transform="translate(130, 40)">
    <!-- Tower Body -->
    <rect x="0" y="0" width="140" height="360" rx="16" fill="url(#dispBody)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Top Black Header -->
    <path d="M0 25 C0 10, 10 0, 25 0 L115 0 C130 0, 140 10, 140 25 L140 50 L0 50 Z" fill="#0F172A"/>
    <text x="70" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8" text-anchor="middle">PUREIT</text>
    <text x="70" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle">HOT &amp; COLD RO</text>
    <!-- Dispensing Alcove -->
    <rect x="15" y="70" width="110" height="120" rx="8" fill="#1E293B"/>
    <!-- Taps: Hot (Red), Normal (Grey), Cold (Blue) -->
    <g transform="translate(25, 85)">
      <!-- Hot -->
      <rect x="5" y="0" width="18" height="25" rx="4" fill="#EF4444"/>
      <rect x="11" y="25" width="6" height="15" fill="#DC2626"/>
      <!-- Normal -->
      <rect x="35" y="0" width="18" height="25" rx="4" fill="#94A3B8"/>
      <rect x="41" y="25" width="6" height="15" fill="#64748B"/>
      <!-- Cold -->
      <rect x="65" y="0" width="18" height="25" rx="4" fill="#0284C7"/>
      <rect x="71" y="25" width="6" height="15" fill="#0369A1"/>
    </g>
    <!-- Drip Tray Grill -->
    <rect x="20" y="165" width="100" height="18" rx="4" fill="#334155"/>
    <line x1="25" y1="174" x2="115" y2="174" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- Lower Cabinet Door -->
    <rect x="15" y="210" width="110" height="135" rx="8" fill="#E2E8F0" stroke="#CBD5E1"/>
    <circle cx="28" cy="270" r="5" fill="#64748B"/>
    <text x="70" y="260" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0F172A" text-anchor="middle">INBUILT RO</text>
    <text x="70" y="275" font-family="sans-serif" font-size="7" fill="#64748B" text-anchor="middle">5-STAGE PURIFIER</text>
  </g>
</svg>
