<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ssGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="vesselGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="450" fill="#F8FAFC" rx="16"/>
  <ellipse cx="200" cy="415" rx="150" ry="18" fill="#CBD5E1" opacity="0.7"/>
  <!-- Skid Frame -->
  <g transform="translate(60, 40)">
    <!-- Base Plate and vertical SS struts -->
    <rect x="0" y="320" width="280" height="15" rx="3" fill="url(#ssGrad)"/>
    <rect x="15" y="40" width="12" height="280" fill="url(#ssGrad)"/>
    <rect x="253" y="40" width="12" height="280" fill="url(#ssGrad)"/>
    <rect x="15" y="40" width="250" height="12" fill="url(#ssGrad)"/>
    <rect x="15" y="160" width="250" height="10" fill="url(#ssGrad)"/>
    <!-- Pre-treatment Jumbo Filter Housing 1 (Sediment) -->
    <rect x="40" y="70" width="45" height="190" rx="8" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
    <rect x="36" y="60" width="53" height="18" rx="4" fill="#0F172A"/>
    <!-- Jumbo Filter Housing 2 (Carbon) -->
    <rect x="95" y="70" width="45" height="190" rx="8" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>
    <rect x="91" y="60" width="53" height="18" rx="4" fill="#0F172A"/>
    <!-- Commercial RO Membrane Housings (Horizontal SS Vessels) -->
    <g transform="translate(150, 75)">
      <rect x="0" y="0" width="115" height="32" rx="16" fill="url(#ssGrad)" stroke="#475569"/>
      <rect x="10" y="5" width="95" height="22" rx="11" fill="#FFFFFF" opacity="0.3"/>
      <text x="57" y="20" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0F172A" text-anchor="middle">RO MEMBRANE 1</text>
    </g>
    <g transform="translate(150, 118)">
      <rect x="0" y="0" width="115" height="32" rx="16" fill="url(#ssGrad)" stroke="#475569"/>
      <rect x="10" y="5" width="95" height="22" rx="11" fill="#FFFFFF" opacity="0.3"/>
      <text x="57" y="20" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0F172A" text-anchor="middle">RO MEMBRANE 2</text>
    </g>
    <!-- Commercial Rotary Booster Pump (Bottom) -->
    <rect x="155" y="235" width="95" height="75" rx="8" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <circle cx="202" cy="272" r="22" fill="#0284C7"/>
    <text x="202" y="276" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PUMP</text>
    <!-- Pressure Gauge -->
    <circle cx="210" cy="190" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <line x1="210" y1="190" x2="218" y2="182" stroke="#EF4444" stroke-width="2"/>
    <!-- Brand Plate -->
    <rect x="40" y="280" width="105" height="30" rx="4" fill="#0F172A" stroke="#38BDF8"/>
    <text x="92" y="296" font-family="sans-serif" font-size="8" font-weight="bold" fill="#38BDF8" text-anchor="middle">MAHALAXMI</text>
    <text x="92" y="306" font-family="sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle">50 LPH PLANT</text>
  </g>
</svg>
