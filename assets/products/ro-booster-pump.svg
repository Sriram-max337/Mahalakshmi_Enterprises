<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pumpMotor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pumpHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="450" fill="#F8FAFC" rx="16"/>
  <ellipse cx="200" cy="390" rx="140" ry="16" fill="#CBD5E1" opacity="0.6"/>
  <g transform="translate(60, 110)">
    <!-- Mounting Feet -->
    <rect x="20" y="190" width="40" height="15" rx="4" fill="#0F172A"/>
    <rect x="220" y="190" width="40" height="15" rx="4" fill="#0F172A"/>
    <!-- Heavy Motor Body (Cylindrical) -->
    <rect x="50" y="40" width="160" height="150" rx="16" fill="url(#pumpMotor)" stroke="#475569" stroke-width="2"/>
    <!-- Cooling Fins -->
    <line x1="80" y1="40" x2="80" y2="190" stroke="#475569" stroke-width="2"/>
    <line x1="110" y1="40" x2="110" y2="190" stroke="#475569" stroke-width="2"/>
    <line x1="140" y1="40" x2="140" y2="190" stroke="#475569" stroke-width="2"/>
    <line x1="170" y1="40" x2="170" y2="190" stroke="#475569" stroke-width="2"/>
    <!-- Motor Spec Label -->
    <rect x="75" y="80" width="110" height="70" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="130" y="100" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0F172A" text-anchor="middle">MAHALAXMI HEAVY DUTY</text>
    <text x="130" y="115" font-family="sans-serif" font-size="8" fill="#0284C7" text-anchor="middle">RO BOOSTER PUMP</text>
    <text x="130" y="130" font-family="sans-serif" font-size="8" fill="#10B981" text-anchor="middle">100 GPD | 24V DC / 1.2A</text>
    <text x="130" y="142" font-family="sans-serif" font-size="7" fill="#64748B" text-anchor="middle">Max Pressure: 130 PSI</text>
    <!-- Diaphragm Pump Head (Triangular / Hexagonal head) -->
    <g transform="translate(200, 30)">
      <path d="M10 20 L75 45 L75 125 L10 150 Z" fill="url(#pumpHead)" stroke="#0369A1" stroke-width="2"/>
      <!-- Water Inlet / Outlet Ports -->
      <rect x="75" y="55" width="22" height="20" rx="4" fill="#E2E8F0" stroke="#94A3B8"/>
      <rect x="75" y="95" width="22" height="20" rx="4" fill="#E2E8F0" stroke="#94A3B8"/>
      <circle cx="86" cy="65" r="5" fill="#0284C7"/>
      <circle cx="86" cy="105" r="5" fill="#EF4444"/>
    </g>
    <!-- Wiring -->
    <path d="M50 115 C20 115, 20 70, 0 70" stroke="#EF4444" stroke-width="3" fill="none"/>
    <path d="M50 125 C25 125, 25 85, 0 85" stroke="#0F172A" stroke-width="3" fill="none"/>
  </g>
  <text x="200" y="360" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">100 GPD 24V DC RO BOOSTER PUMP</text>
</svg>
