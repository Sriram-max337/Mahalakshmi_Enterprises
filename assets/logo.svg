<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 85" width="100%" height="100%">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#0A58CA" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2A47" />
      <stop offset="100%" stop-color="#07192C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 8)">
    <path d="M35 2 C54 2, 70 18, 70 37 C70 56, 54 70, 35 70 C16 70, 0 56, 0 37 C0 18, 16 2, 35 2 Z" fill="url(#shieldGrad)" />
    <circle cx="35" cy="36" r="30" stroke="url(#waterGrad)" stroke-width="2.5" fill="none" opacity="0.4"/>
    <path d="M35 12 C35 12, 53 34, 53 45 C53 54.9, 44.9 63, 35 63 C25.1 63, 17 54.9, 17 45 C17 34, 35 12, 35 12 Z" fill="url(#waterGrad)" filter="url(#glow)"/>
    <path d="M35 26 C38 34, 46 38, 46 47 C46 51.5, 42.4 55, 38 55 C34.5 55, 32 52, 32 49 C32 42, 35 26, 35 26 Z" fill="#FFFFFF" opacity="0.85" />
    <circle cx="43" cy="22" r="3" fill="#00FFC2" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(92, 12)">
    <text x="0" y="28" font-family="'Poppins', 'Montserrat', -apple-system, sans-serif" font-weight="800" font-size="22" letter-spacing="0.5" fill="#0B192C">
      DHANALAKSHMI <tspan fill="#0088EA">PUREIT</tspan>
    </text>
    <text x="0" y="47" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="10.5" letter-spacing="2.2" fill="#5A6E85">
      MAHALAXMI ENTERPRISES
    </text>
    <text x="0" y="61" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="8.5" letter-spacing="1" fill="#00A8E8">
      ADVANCED WATER PURIFICATION &amp; SOLAR SYSTEMS
    </text>
  </g>
</svg>
