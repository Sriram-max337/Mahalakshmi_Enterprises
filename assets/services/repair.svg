<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" rx="14" fill="#FEF2F2"/>
  <circle cx="150" cy="100" r="70" fill="#FEE2E2"/>
