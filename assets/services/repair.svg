    <!-- Diagnostic Gear & Wrench -->
    <circle cx="50" cy="45" r="32" fill="none" stroke="#EF4444" stroke-width="8" stroke-dasharray="12 6"/>
    <circle cx="50" cy="45" r="16" fill="#EF4444"/>
