<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="450" fill="#F8FAFC" rx="16"/>
  <!-- Sun and rays -->
  <circle cx="320" cy="90" r="45" fill="url(#sunGrad)" opacity="0.9"/>
  <circle cx="320" cy="90" r="60" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 4" fill="none" opacity="0.5"/>
  <!-- Modern Rooftop Solar Array (Perspective Tilt) -->
  <g transform="translate(40, 140)">
    <!-- Aluminum Mount Structure -->
    <line x1="30" y1="180" x2="60" y2="80" stroke="#94A3B8" stroke-width="6"/>
    <line x1="290" y1="180" x2="260" y2="80" stroke="#94A3B8" stroke-width="6"/>
    <line x1="160" y1="180" x2="160" y2="80" stroke="#94A3B8" stroke-width="6"/>
    <!-- Panel 1 (Left) -->
    <path d="M40 90 L150 70 L135 180 L20 200 Z" fill="url(#panelGrad)" stroke="#CBD5E1" stroke-width="3"/>
    <!-- Panel 1 Grid lines -->
    <line x1="95" y1="80" x2="77" y2="190" stroke="#93C5FD" stroke-width="1.5" opacity="0.6"/>
    <line x1="35" y1="125" x2="145" y2="105" stroke="#93C5FD" stroke-width="1.5" opacity="0.6"/>
    <line x1="28" y1="160" x2="140" y2="140" stroke="#93C5FD" stroke-width="1.5" opacity="0.6"/>
    <!-- Panel 2 (Right) -->
    <path d="M170 66 L280 46 L295 155 L185 175 Z" fill="url(#panelGrad)" stroke="#CBD5E1" stroke-width="3"/>
    <!-- Panel 2 Grid lines -->
    <line x1="225" y1="56" x2="240" y2="165" stroke="#93C5FD" stroke-width="1.5" opacity="0.6"/>
    <line x1="175" y1="102" x2="285" y2="82" stroke="#93C5FD" stroke-width="1.5" opacity="0.6"/>
    <line x1="180" y1="138" x2="290" y2="118" stroke="#93C5FD" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- Text Label -->
  <rect x="60" y="360" width="280" height="50" rx="10" fill="#0F172A"/>
  <text x="200" y="383" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FBBF24" text-anchor="middle">TURNKEY ROOFTOP SOLAR SOLUTIONS</text>
  <text x="200" y="399" font-family="sans-serif" font-size="9.5" fill="#94A3B8" text-anchor="middle">Residential &amp; Commercial 3 kW to 100 kW+</text>
</svg>
