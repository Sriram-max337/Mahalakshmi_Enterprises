<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="batBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="450" fill="#F8FAFC" rx="16"/>
  <ellipse cx="200" cy="415" rx="140" ry="16" fill="#CBD5E1" opacity="0.6"/>
  <g transform="translate(65, 80)">
    <!-- Battery Top Cover (Red) -->
    <path d="M10 30 L260 30 L250 5 L20 5 Z" fill="#DC2626"/>
    <!-- Terminal Poles -->
    <rect x="35" y="-12" width="22" height="20" rx="4" fill="#EF4444"/>
    <text x="46" y="2" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">+</text>
    <rect x="215" y="-12" width="22" height="20" rx="4" fill="#1E293B"/>
    <text x="226" y="2" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">-</text>
    <!-- Vent Plugs (6 Float Indicators) -->
    <circle cx="75" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="105" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="135" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="165" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="195" cy="18" r="6" fill="#F59E0B"/>
    <!-- Tall Tubular Polypropylene Container -->
    <rect x="10" y="30" width="250" height="290" rx="12" fill="url(#batBody)" stroke="#1E293B" stroke-width="2"/>
    <!-- Ribbed Vertical Grooves -->
    <line x1="45" y1="45" x2="45" y2="305" stroke="#1E293B" stroke-width="3"/>
    <line x1="80" y1="45" x2="80" y2="305" stroke="#1E293B" stroke-width="3"/>
    <line x1="190" y1="45" x2="190" y2="305" stroke="#1E293B" stroke-width="3"/>
    <line x1="225" y1="45" x2="225" y2="305" stroke="#1E293B" stroke-width="3"/>
    <!-- Front Label Graphic -->
    <rect x="50" y="70" width="170" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="50" y="70" width="170" height="35" rx="8" fill="#0F172A"/>
    <text x="135" y="93" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F59E0B" text-anchor="middle">MAHALAXMI SOLAR</text>
    <text x="135" y="125" font-family="sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="middle">200 Ah / 12V</text>
    <text x="135" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0284C7" text-anchor="middle">TALL TUBULAR C10</text>
    <text x="135" y="165" font-family="sans-serif" font-size="9" fill="#16A34A" text-anchor="middle">60 Months Warranty</text>
    <text x="135" y="180" font-family="sans-serif" font-size="8.5" fill="#64748B" text-anchor="middle">Ultra Low Maintenance</text>
  </g>
</svg>
