<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="invBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <rect width="400" height="450" fill="#F8FAFC" rx="16"/>
  <ellipse cx="200" cy="410" rx="130" ry="15" fill="#CBD5E1" opacity="0.6"/>
  <g transform="translate(80, 50)">
    <!-- Inverter Wall Case -->
    <rect x="0" y="0" width="240" height="340" rx="20" fill="url(#invBody)" stroke="#334155" stroke-width="2"/>
    <!-- Yellow Accent Line -->
    <rect x="0" y="45" width="240" height="5" fill="#F59E0B"/>
    <!-- Brand -->
    <text x="120" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MAHALAXMI <tspan fill="#F59E0B">SOLAR</tspan></text>
    <!-- LCD Screen -->
    <rect x="35" y="70" width="170" height="110" rx="8" fill="url(#lcd)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="120" y="100" font-family="monospace" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SOLAR: 2.85 kW</text>
    <text x="120" y="125" font-family="monospace" font-size="13" fill="#BAE6FD" text-anchor="middle">BATTERY: 100% | 54.2V</text>
    <text x="120" y="150" font-family="monospace" font-size="12" fill="#00FFC2" text-anchor="middle">GRID FEED: NORMAL</text>
    <!-- Navigation Buttons -->
    <circle cx="65" cy="205" r="10" fill="#334155" stroke="#94A3B8"/>
    <circle cx="100" cy="205" r="10" fill="#334155" stroke="#94A3B8"/>
    <circle cx="135" cy="205" r="10" fill="#334155" stroke="#94A3B8"/>
    <circle cx="170" cy="205" r="10" fill="#10B981"/>
    <!-- Ventilation Grill -->
    <g transform="translate(30, 240)">
      <line x1="0" y1="0" x2="180" y2="0" stroke="#334155" stroke-width="3"/>
      <line x1="0" y1="12" x2="180" y2="12" stroke="#334155" stroke-width="3"/>
      <line x1="0" y1="24" x2="180" y2="24" stroke="#334155" stroke-width="3"/>
      <line x1="0" y1="36" x2="180" y2="36" stroke="#334155" stroke-width="3"/>
    </g>
    <!-- Specs Badge -->
    <rect x="40" y="295" width="160" height="30" rx="6" fill="#1E293B" stroke="#475569"/>
    <text x="120" y="314" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F59E0B" text-anchor="middle">3.5 kVA / 48V MPPT HYBRID</text>
  </g>
</svg>
